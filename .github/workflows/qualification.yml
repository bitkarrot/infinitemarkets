name: qualification

# Infinitemarkets conformance-profile qualification (D-01, D-03, D-04, D-09).
#
# Blocking matrix (D-03): Linux x86_64 + Linux ARM64, each with SQLite and
# PostgreSQL — four profiles that must all pass clean (D-10).

on:
  push:
  pull_request:

defaults:
  run:
    shell: bash

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"
          package-manager-cache: false
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: "3.12"
      - name: Validate Node policy
        working-directory: tests/e2e
        run: |
          node -e 'const major = Number(process.versions.node.split(".")[0]); if (major !== 22 && major !== 24) process.exit(1)'
          npm ci --ignore-scripts
          npx playwright --version
      - name: Lint
        run: |
          python3 tools/checkout_host.py
          uv run ruff check .

  qualify-sqlite:
    name: qualification (sqlite / ${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    env:
      LNBITS_BACKEND_WALLET_CLASS: FakeWallet
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: "3.12"
      - name: Run qualification suite (SQLite profile)
        run: make verify 2>&1 | tee pytest-output.txt
      - name: Upload evidence bundle
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: qualification-evidence-sqlite-${{ matrix.runner }}
          path: |
            evidence/manifest.json
            evidence/REPORT.md
            pytest-output.txt

  qualify-postgres:
    name: qualification (postgresql / ${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    env:
      LNBITS_BACKEND_WALLET_CLASS: FakeWallet
      LNBITS_DATABASE_URL: postgres://lnbits:lnbits@localhost:5432/lnbits
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: lnbits
          POSTGRES_PASSWORD: lnbits
          POSTGRES_DB: lnbits
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: "3.12"
      - name: Run qualification suite (PostgreSQL profile)
        run: make verify 2>&1 | tee pytest-output.txt
      - name: Upload evidence bundle
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: qualification-evidence-postgresql-${{ matrix.runner }}
          path: |
            evidence/manifest.json
            evidence/REPORT.md
            pytest-output.txt
