[project]
name = "infinitemarkets"
version = "0.1.0"
description = "Infinite Markets qualification harness (Phase 1 contract conformance; no production runtime code)"
requires-python = ">=3.12,<3.13"
dependencies = [
    # LNbits pinned host, resolved via [tool.uv.sources] to the checkout
    # created by tools/checkout_host.py (commit e336fe14b841d6f0c940e75b3d343e3ab5cf8433).
    "lnbits",
    # Nostr SDK candidate. Exact pin, stricter than the host's ~=0.44.0,
    # so the lock cannot drift to a newer 0.44.x (D-13).
    "nostr-sdk==0.44.8",
]

[dependency-groups]
dev = [
    "pytest~=9.0",
    "pytest-asyncio>=0.25",
    "ruff~=0.14",
    # Local deterministic relay fixture (harness/relay.py)
    "websockets~=15.0",
    # Host app boot fixture (harness/host.py), mirroring the host's test stack
    "asgi-lifespan~=2.1",
]

[tool.uv]
# The harness is not an installable package; tests import it via pytest
# pythonpath = ["."].
package = false
# GHSA-ffc3-869f-jxw9 / CVE-2026-102268 — the pinned LNbits host declares
# pyjwt~=2.12.0 (vulnerable <=2.13.0); resolve the patched 2.14.x line.
override-dependencies = ["pyjwt>=2.14.0,<3.0.0", "multidict>=6.9.1", "oauthlib>=4.0.0"]

[tool.uv.sources]
lnbits = { path = ".cache/lnbits" }

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
