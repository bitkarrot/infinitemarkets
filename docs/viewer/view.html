<meta name="description" content="An Infinite Markets architecture diagram, rendered pan-and-zoom with Mermaid.">
<meta property="og:title" content="Infinite Markets — Architecture diagram">
<meta property="og:description" content="A zoomable Infinite Markets system diagram.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://infinitemarkets-docs.vercel.app/view.html">
<meta property="og:site_name" content="Infinite Markets">
<meta property="og:image" content="https://infinitemarkets-docs.vercel.app/media/demo-poster.jpg">
<meta property="og:image:width" content="1600">
<meta property="og:image:height" content="900">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Infinite Markets — Architecture diagram">

<meta name="twitter:image" content="https://infinitemarkets-docs.vercel.app/media/demo-poster.jpg">
<meta property="og:locale" content="en_US">

<link rel="canonical" href="https://infinitemarkets-docs.vercel.app/view.html">
<link rel="apple-touch-icon" href="img/logo-512.png">
<script>document.documentElement.dataset.theme = localStorage.getItem('imv-theme') || 'dark';</script>
<link rel="stylesheet" href="assets/style.css">
<link rel="icon" href="img/logo-128.png">
</head>
<body class="viewer">

<div id="hud">
  <h1 id="hudTitle">Loading…</h1>
  <p><span id="hudSrc"></span> — scroll to zoom, drag to pan · <a href="architecture.html">← all diagrams</a></p>
</div>

<div id="controls">
  <button id="zin" title="Zoom in">+</button>
  <button id="zout" title="Zoom out">&minus;</button>
  <button id="fit" title="Fit whole diagram">Fit</button>
  <button id="fitw" title="Fit width — pan up/down">Fit W</button>
  <button id="fith" title="Fit height — pan left/right">Fit H</button>
  <button id="actual" title="Actual size">1:1</button>
  <button id="themeBtn" title="Toggle dark / light">☀ Light</button>
  <button id="notesBtn" title="Toggle notes / long-form outline">Notes</button>
  <span id="zoomPct">100%</span>
</div>

<div id="legend"></div>

<div id="viewport">
  <div id="canvas"><pre class="mermaid" id="src"></pre></div>
</div>

<aside id="notes">
  <button id="closeNotes" title="Close">×</button>
  <div class="notes-head">
    <h2 id="notesTitle"></h2>
    <p id="notesSrc"></p>
  </div>
  <div id="notesBody"></div>
</aside>

<script src="assets/mermaid.min.js"></script>
<script src="diagrams/registry.js"></script>
<script src="assets/viewer.js"></script>
</body>
</html>
