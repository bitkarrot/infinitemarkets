<body class="viewer">

<div id="hud">
  <h1 id="hudTitle">Loading…</h1>
  <p><span id="hudSrc"></span> — scroll to zoom, drag to pan · <a href="architecture.html">← all diagrams</a></p>
</div>

<div id="controls">
  <button id="zin" title="Zoom in">+</button>
  <button id="zout" title="Zoom out">&minus;</button>
  <button id="fit" title="Fit whole diagram">Fit</button>
  <button id="fitw" title="Fit width — pan up/down">Fit W</button>
  <button id="fith" title="Fit height — pan left/right">Fit H</button>
  <button id="actual" title="Actual size">1:1</button>
  <button id="themeBtn" title="Toggle dark / light">☀ Light</button>
  <button id="notesBtn" title="Toggle notes / long-form outline">Notes</button>
  <button id="menuBtn" title="Site menu" aria-expanded="false" aria-controls="siteMenu">☰</button>
  <span id="zoomPct">100%</span>
</div>

<div class="site">
  <div class="site-menu float" id="siteMenu" hidden>
    <div><b>Diagram</b>
      <a href="architecture.html">All diagrams</a>
    </div>
    <div><b>More</b>
      <a href="index.html">Home</a>

</div>

<div id="legend"></div>

<div id="viewport">
  <div id="canvas"><pre class="mermaid" id="src"></pre></div>
</div>

<aside id="notes">
  <button id="closeNotes" title="Close">×</button>
  <div class="notes-head">
    <h2 id="notesTitle"></h2>
    <p id="notesSrc"></p>
  </div>
  <div id="notesBody"></div>
</aside>

<script src="assets/mermaid.min.js"></script>
<script src="diagrams/registry.js"></script>
<script src="assets/viewer.js"></script>
<script>
  /* site menu */
  const menuBtn = document.getElementById('menuBtn'), menu = document.getElementById('siteMenu');
  const setMenu = open => { menu.hidden = !open; menuBtn.setAttribute('aria-expanded', open); menuBtn.textContent = open ? '✕' : '☰'; };
  menuBtn.addEventListener('click', () => setMenu(menu.hidden));
  menu.addEventListener('click', e => { if (e.target.closest('a')) setMenu(false); });
  addEventListener('keydown', e => { if (e.key === 'Escape') setMenu(false); });
  document.addEventListener('click', e => { if (!menu.hidden && !e.target.closest('#siteMenu, #menuBtn')) setMenu(false); });
</script>
</body>
